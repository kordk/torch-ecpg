version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      
    # Retaining your preferred limit
    open-pull-requests-limit: 10

    # Grouping non-critical updates to reduce Pull Request noise
    groups:
      dev-tools:
        patterns:
          - "pytest"
          - "black"
          - "flake8"
          - "sphinx"
          - "isort"

    # CRITICAL: The Shield for our HPC/GPU Backend
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "torchvision"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "torchaudio"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
