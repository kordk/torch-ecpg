version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    
    # TELL DEPENDABOT TO LOOK AT THE DEV BRANCH
    target-branch: "dev"
    
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      
    open-pull-requests-limit: 10

    groups:
      dev-tools:
        patterns:
          - "pytest"
          - "black"
          - "flake8"
          - "sphinx"
          - "isort"

    # CRITICAL: The Shield for our HPC/GPU Backend
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "torchvision"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "torchaudio"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
