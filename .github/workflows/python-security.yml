name: Python Security Linter

on: [pull_request]

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install Bandit
      run: pip install bandit
      
    - name: Run Bandit Scan
      run: bandit -r . -ll -ii # Scans recursively, reports medium/high severity
